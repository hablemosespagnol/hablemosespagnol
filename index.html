<style>
:root{--bg:#f1f5fa;--surf:#fff;--ink:#12263f;--mute:#5d7089;--blue:#1f5fbf;--sun:#f2b632;--ok:#23844f;--bad:#cf3f3f;--line:#d6e0ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1828;--surf:#172538;--ink:#e8eef7;--mute:#9fb0c7;--blue:#6aa2ff;--ok:#4cc58a;--bad:#ff7b7b;--line:#2a3b54;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1828;--surf:#172538;--ink:#e8eef7;--mute:#9fb0c7;--blue:#6aa2ff;--ok:#4cc58a;--bad:#ff7b7b;--line:#2a3b54;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.5rem;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:20px 0 6px}
.sub{color:var(--mute);margin:0 0 12px;font-size:.95rem}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 2px;border:0;background:none;color:var(--mute);font-weight:600;font-size:.82rem;font-family:inherit;cursor:pointer}
nav button.on{color:var(--blue);box-shadow:inset 0 3px 0 var(--sun)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:600;font-size:.9rem;font-family:inherit;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.card{background:var(--surf);border:2px solid var(--blue);border-radius:20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;position:relative}
.card .es{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.card .fr{font-size:1.4rem;color:var(--blue);margin-top:10px;font-weight:600}
.card .hint{position:absolute;bottom:12px;color:var(--mute);font-size:.85rem}
.say{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:14px;border:0;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer;color:#fff;background:var(--blue)}
.btn.no{background:var(--bad)}.btn.yes{background:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:8px}
.q{font-size:1.7rem;font-weight:800;margin:16px 0 12px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-weight:600;font-size:1.02rem;font-family:inherit;cursor:pointer}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surf))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--surf))}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--blue)}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat div{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:.85rem}
.stat b{display:block;font-size:1.5rem}
.tip{background:var(--surf);border-left:5px solid var(--sun);padding:10px 14px;border-radius:10px;margin-top:8px;font-size:.93rem}
table{width:100%;border-collapse:collapse;background:var(--surf);border-radius:14px;overflow:hidden;margin:8px 0}
td{padding:11px 14px;border-bottom:1px solid var(--line)}
td:first-child{color:var(--mute);width:38%}td:last-child{font-weight:700}
.dl{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-family:inherit;font-size:1rem;cursor:pointer}
.dl small{display:block;color:var(--mute);font-size:.8rem}
.dl em{display:block;color:var(--blue);font-style:normal;margin-top:4px}
input{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-size:1.2rem;font-family:inherit;margin:10px 0}
.bigv{font-size:1.4rem;font-weight:800;margin:14px 0 2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;background-color:#1f5fbf;color:#fff;background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.2) 3px,transparent 4px),radial-gradient(circle at 36px 36px,rgba(242,182,50,.45) 3px,transparent 4px);background-size:48px 48px;border-bottom:4px solid var(--sun)}
.top b{font-size:1.2rem;letter-spacing:-.02em}
.top small{display:block;margin-top:4px;opacity:.92}
.goal{height:8px;border-radius:5px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden;width:170px;max-width:100%}
.goal i{display:block;height:100%;background:var(--sun);transition:width .4s}
.pill{display:inline-block;background:rgba(255,255,255,.2);padding:6px 11px;border-radius:999px;font-weight:700;font-size:.9rem}
main{padding-top:20px}
.card{border:0;border-radius:26px;min-height:250px;box-shadow:0 6px 0 var(--blue),0 14px 28px rgba(18,38,63,.12)}
.card .es{font-size:2.4rem}
.btn{border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.opt{box-shadow:0 3px 0 var(--line)}
.opt.good{animation:pop .35s}
.opt.wrong{animation:shake .3s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
nav button span{display:block;font-size:1.3rem;line-height:1.1}
nav button.on{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.chip.on{box-shadow:0 3px 0 rgba(0,0,0,.25)}
nav button{font-size:.72rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:78px;padding:6px;border-radius:14px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-weight:700;font-size:.95rem;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile.on{border-color:var(--blue);color:var(--blue)}
.tile.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--surf));color:var(--ink)}
.wd{display:inline-block;margin:4px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.slot{min-height:64px;border-bottom:3px dashed var(--line);margin:10px 0 14px}
nav{overflow-x:auto}nav button{flex:1 0 auto;min-width:64px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;line-height:1.4}
.msg.u{background:#1f5fbf;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg small{display:block;color:var(--mute);margin-top:6px}
.lk{background:none;border:0;color:var(--blue);font-weight:700;font-family:inherit;cursor:pointer;padding:6px 10px 0 0}
.fix{background:color-mix(in srgb,var(--sun) 22%,var(--surf));border-left:5px solid var(--sun);padding:10px 14px;border-radius:12px;margin:8px 0;font-size:.95rem}
.fix s{color:var(--bad)}.fix b{color:var(--ok)}.fix small{display:block;color:var(--mute);margin-top:4px}
.cin{display:flex;gap:8px;position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0}
.cin input{margin:0;flex:1;min-width:0}.cin .btn{flex:0 0 auto;padding:0 16px}
details{margin-bottom:10px}summary{cursor:pointer;color:var(--blue);font-weight:700;padding:6px 0}
.chead{display:flex;align-items:center;gap:12px;padding:10px 4px 12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--sun);color:#12263f;font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.chead small{display:block;color:var(--ok);font-size:.82rem}
.chatbox{background:color-mix(in srgb,var(--blue) 7%,var(--bg));border-radius:20px;padding:10px;min-height:48vh}
.msg{padding:9px 13px 6px;margin:3px 0;max-width:82%;width:fit-content;border-radius:18px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg.u{margin-left:auto;border-bottom-right-radius:5px}
.msg.a{border-bottom-left-radius:5px}
.msg .t{font-size:.7rem;opacity:.7;margin-top:3px;text-align:right}
.msg.u small{color:#cfe0ff}
.dots{display:flex;gap:5px;padding:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

function chatV(){
const R=window.SpeechRecognition||window.webkitSpeechRecognition;
const set=`<div class="meta"><span>Prénom de ton partenaire</span></div><input id="an" value="${esc(aiName())}" maxlength="20" style="margin:0 0 8px">`+chips(Object.keys(MODES),cm,"cm",x=>MODES[x][0])+chips(LV,L,"l");
const err=cerr?`<p class="sub">${cerr}</p>`:"";
if(!chat.length)return `<h1>Parler</h1><p class="sub">Discute en espagnol avec ${esc(aiName())}. Elle te corrige, te demande ce que tu voulais dire en cas de doute, et te pose des questions. Tes messages ne sont pas enregistrés par la page.</p>`+set+`<button class="btn" id="st" style="width:100%" ${busy?"disabled":""}>${busy?"…":"Commencer la discussion"}</button>`+err;
const items=chat.map((m,i)=>{if(m.role==="user")return `<div class="msg u">${esc(m.text)}<small class="t">${tm(m.t)}</small></div>`;
const j=m.j;let h="";
if(j.fix)h+=`<div class="fix">✏️ <s>${esc(j.fix.said||"")}</s><br><b>${esc(j.fix.better||"")}</b><small>${esc(j.fix.why||"")}</small></div>`;
if(j.unclear)h+=`<div class="msg a"><b>${esc(j.unclear)}</b></div>`;
if(j.reply)h+=`<div class="msg a">${esc(j.reply)}<div><button class="lk" data-sp="${i}">🔊 Écouter</button>${j.fr?`<button class="lk" data-tr="${i}">Traduire</button>`:""}</div>${tr[i]?`<small>${esc(j.fr||"")}</small>`:""}<small class="t">${tm(m.t)}</small></div>`;
return h}).join("");
return `<div class="chead"><div class="av">${esc(aiName().charAt(0).toUpperCase())}</div><div><b>${esc(aiName())}</b><small>${busy?"écrit…":"en ligne · "+MODES[cm][0]+" · "+L}</small></div></div><details><summary>Réglages</summary>${set}<button class="chip" id="nw">Nouvelle discussion</button></details><div class="chatbox">${items}${busy?`<div class="msg a dots"><i></i><i></i><i></i></div>`:""}${err}</div><div class="cin"><input id="ci" autocomplete="off" placeholder="Message en español…" value="${esc(cin)}"><button class="btn" id="sd" aria-label="Envoyer" ${busy?"disabled":""}>➤</button>${R?`<button class="btn mic" id="mc" aria-label="Dicter">🎤</button>`:""}</div>`}
function bChat(){lvBind();bind("cm",m=>{cm=m;render()});
const an=$("#an");if(an)an.onchange=()=>{S.ai=(an.value.trim()||"Sofía").slice(0,20);save();render()};
const st=$("#st");if(st)st.onclick=()=>ask("");
const nw=$("#nw");if(nw)nw.onclick=()=>{chat=[];tr={};cin="";render()};
const ci=$("#ci");
const send=()=>{const v=ci.value.trim();if(!v||busy)return;cin="";ask(v)};
if(ci){ci.onkeydown=e=>{if(e.key==="Enter")send()};ci.oninput=()=>{cin=ci.value}}
const sd=$("#sd");if(sd)sd.onclick=send;
const mc=$("#mc");if(mc)mc.onclick=()=>{try{const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang="es-ES";r.onresult=e=>{ci.value=e.results[0][0].transcript;cin=ci.value};r.start()}catch(e){}};
bind("sp",i=>say(chat[+i].j.reply));
bind("tr",i=>{tr[i]=!tr[i];render()})}
function logo(z){return `<svg width="${z}" height="${z}" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#1f5fbf"/><path d="M20 24h60a8 8 0 0 1 8 8v30a8 8 0 0 1-8 8H52L36 88V70H20a8 8 0 0 1-8-8V32a8 8 0 0 1 8-8z" fill="#fff"/><text x="50" y="57" text-anchor="middle" font-size="30" font-weight="800" fill="#1f5fbf" font-family="system-ui,sans-serif">¡H!</text><circle cx="82" cy="20" r="9" fill="#f2b632"/></svg>`}
function welcome(){const w=$("#wl");
const out=()=>{w.classList.add("out");setTimeout(()=>w.remove(),500)};
if(S.seen){w.innerHTML=`<div class="wc">${logo(96)}<h2>Hablemos</h2></div>`;setTimeout(out,1000);return}
w.innerHTML=`<div class="wc">${logo(110)}<h2>Hablemos</h2><p>Parle espagnol, pour de vrai.</p><p class="wq">Où en es-tu ?</p><button data-w="A1">Je débute</button><button data-w="A2">Je connais les bases</button><button data-w="B1">Je me débrouille</button><button data-w="B2">Je suis avancé</button></div>`;
bind("w",l=>{L=l;S.seen=1;save();build();render();out()})}
build();render();welcome();
</script>
</body>
</html>
